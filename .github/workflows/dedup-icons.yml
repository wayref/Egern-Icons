name: Deduplicate Icons

on:
  push:
    paths:
      - 'Egern-Icons.json'
  workflow_dispatch:
  schedule:
    # Run daily at 02:00 UTC to clean up orphans
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Need full history for file age check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Run deduplication
        run: |
          python3 scripts/dedup_icons.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No duplicates found, nothing to commit"
          else
            git commit -m "chore: remove duplicate icons (auto)"
            git pull --rebase origin main
            git push
          fi
