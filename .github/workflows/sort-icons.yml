name: Auto-sort Icons

on:
  push:
    branches: [main]
    paths:
      - 'Color/*.png'
      - 'Egern-Icons.json'
  workflow_dispatch:

jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install Pillow
      
      - name: Sort icons
        run: python3 scripts/sort_icons.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "wayref@users.noreply.github.com"
          git config --local user.name "wayref"
          git add Egern-Icons.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sort icons: transparent first, rounded middle, flags last"
            git pull --rebase origin main
            git push
          fi
